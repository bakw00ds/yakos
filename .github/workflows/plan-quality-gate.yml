# plan-quality-gate fail-closed regression suite (K-81).
#
# Separate from hook-parity.yml on purpose: that workflow's bash smoke step only
# checks exit 0 on a few fixtures, which cannot catch a fail-open regression in
# the PreToolUse gate. macos-latest matters: /bin/bash there is 3.2, where a
# crash or a failed `source` used to pass the dispatch through silently.
name: plan-quality-gate

on:
  push:
    branches: [main]
    paths:
      - 'lib/hooks/**'
      - 'tests/run-plan-quality-gate*.sh'
      - '.github/workflows/plan-quality-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/hooks/**'
      - 'tests/run-plan-quality-gate*.sh'
      - '.github/workflows/plan-quality-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate + scorer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Fail-closed gate tests (bash on PATH and /bin/bash)
        shell: bash
        run: bash tests/run-plan-quality-gate-failclosed-test.sh
