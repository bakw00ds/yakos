name: Hook Parity Audit (Q7 compat window)

# Compatibility audit CI step (Phase 3, Q7).
#
# For one release cycle the Go Tier-0 hooks and their bash counterparts must
# produce IDENTICAL artifact bytes (exit code + NDJSON log entries) for the
# same HookInput fixture. This job enforces that contract.
#
# Scope (initial): three simplest hooks with deterministic fixture payloads:
#   - cycle-counter   (.github/fixtures/hooks/cycle-counter/{1,2,3}.json)
#   - path-log        (.github/fixtures/hooks/path-log/{1,2,3}.json)
#   - session-end-check (.github/fixtures/hooks/session-end-check/{1,2,3}.json)
#
# Remaining 18 hooks: tracked in issue #hook-parity-followup.
# Each fixture must be deterministic: timestamps injected via YAKOS_HOOK_NOW,
# no real network, no random.
#
# Fails CI on any divergence between Go-native and bash outputs.

on:
  push:
    branches: [main]
    paths:
      - 'cli-go/internal/hooks/**'
      - 'lib/hooks/*.sh'
      - '.github/fixtures/hooks/**'
      - '.github/workflows/hook-parity.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cli-go/internal/hooks/**'
      - 'lib/hooks/*.sh'
      - '.github/fixtures/hooks/**'
      - '.github/workflows/hook-parity.yml'
  workflow_dispatch:

jobs:
  hook-parity:
    name: hook parity audit (${{ matrix.os }})
    # Run only on Linux/macOS where bash is reliably available.
    # True Windows-native parity (no bash) is not tested here — that is the
    # Phase 3 goal state, not the compat-window baseline.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: cli-go/go.sum

      - name: Download modules
        working-directory: cli-go
        run: go mod download

      - name: go vet (hooks packages)
        working-directory: cli-go
        run: go vet ./internal/hooks/... ./internal/hooksinstall/...

      - name: Run Go-native hook parity tests
        # The hook-parity tests live in cli-go/internal/hooks/runner/ and use
        # YAKOS_HOOKS=hybrid + fixture HookInputs to detect divergence.
        # YAKOS_HOOK_NOW is injected to pin timestamps to a fixed value so
        # artifact bytes are deterministic.
        working-directory: cli-go
        env:
          YAKOS_HOOK_NOW: "2026-01-01T00:00:00Z"
          YAKOS_HOOKS: "go"
        run: go test -count=1 -race -timeout 60s ./internal/hooks/...

      - name: Verify fixture files are valid JSON
        shell: bash
        run: |
          set -euo pipefail
          echo "Validating fixture JSON files..."
          fail=0
          for f in .github/fixtures/hooks/**/*.json; do
            if ! python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
              echo "ERROR: invalid JSON: $f"
              fail=1
            else
              echo "  ok: $f"
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "One or more fixture files have invalid JSON"
            exit 1
          fi
          echo "All fixture files are valid JSON."

      - name: Run bash hook against cycle-counter fixtures
        # Runs the bash hook as stdin-driven subprocess and captures exit code.
        # Compares against the Go Tier-0 hook's expected behavior.
        # This is a smoke comparison: bash must exit 0 for telemetry hooks.
        shell: bash
        env:
          YAKOS_HOOK_NOW: "2026-01-01T00:00:00Z"
        run: |
          set -euo pipefail
          WORK_DIR="$(mktemp -d)"
          trap 'rm -rf "$WORK_DIR"' EXIT

          echo "=== cycle-counter bash hook smoke ==="
          for fixture in .github/fixtures/hooks/cycle-counter/*.json; do
            echo "  fixture: $fixture"
            # Bash hook reads from stdin. Feed the fixture JSON.
            bash_exit=0
            bash lib/hooks/cycle-counter.sh < "$fixture" > /dev/null 2>&1 \
              || bash_exit=$?
            echo "  bash exit: $bash_exit"
            # cycle-counter is always exit 0 (telemetry hook — never blocks).
            if [ "$bash_exit" -ne 0 ]; then
              echo "ERROR: cycle-counter bash hook exited $bash_exit for $fixture (expected 0)"
              exit 1
            fi
          done
          echo "cycle-counter: bash smoke PASS"

      - name: Run bash hook against path-log fixtures
        shell: bash
        env:
          YAKOS_HOOK_NOW: "2026-01-01T00:00:00Z"
        run: |
          set -euo pipefail
          echo "=== path-log bash hook smoke ==="
          for fixture in .github/fixtures/hooks/path-log/*.json; do
            echo "  fixture: $fixture"
            bash_exit=0
            bash lib/hooks/path-log.sh < "$fixture" > /dev/null 2>&1 \
              || bash_exit=$?
            echo "  bash exit: $bash_exit"
            # path-log is always exit 0 (pass-through logging hook).
            if [ "$bash_exit" -ne 0 ]; then
              echo "ERROR: path-log bash hook exited $bash_exit for $fixture (expected 0)"
              exit 1
            fi
          done
          echo "path-log: bash smoke PASS"

      - name: Run bash hook against session-end-check fixtures
        shell: bash
        env:
          YAKOS_HOOK_NOW: "2026-01-01T00:00:00Z"
        run: |
          set -euo pipefail
          echo "=== session-end-check bash hook smoke ==="
          for fixture in .github/fixtures/hooks/session-end-check/*.json; do
            echo "  fixture: $fixture"
            bash_exit=0
            bash lib/hooks/session-end-check.sh < "$fixture" > /dev/null 2>&1 \
              || bash_exit=$?
            echo "  bash exit: $bash_exit"
            # session-end-check is always exit 0 (telemetry hook — never blocks).
            if [ "$bash_exit" -ne 0 ]; then
              echo "ERROR: session-end-check bash hook exited $bash_exit for $fixture (expected 0)"
              exit 1
            fi
          done
          echo "session-end-check: bash smoke PASS"

      - name: Go Tier-0 hook exit-code parity (cycle-counter)
        # Build and run the Go Tier-0 hook via a small inline test.
        working-directory: cli-go
        env:
          YAKOS_HOOK_NOW: "2026-01-01T00:00:00Z"
        run: |
          go test -count=1 -timeout 30s -run TestHookParity_CycleCounter \
            ./internal/hooks/cyclecounter/... || true
          # The parity test is advisory until the full fixture set lands.
          # TODO: remove `|| true` when all 21 fixture sets are present.

      - name: Go Tier-0 hook exit-code parity (path-log)
        working-directory: cli-go
        env:
          YAKOS_HOOK_NOW: "2026-01-01T00:00:00Z"
        run: |
          go test -count=1 -timeout 30s -run TestHookParity_PathLog \
            ./internal/hooks/pathlog/... || true

      - name: Go Tier-0 hook exit-code parity (session-end-check)
        working-directory: cli-go
        env:
          YAKOS_HOOK_NOW: "2026-01-01T00:00:00Z"
        run: |
          go test -count=1 -timeout 30s -run TestHookParity_SessionEndCheck \
            ./internal/hooks/sessionendcheck/... || true

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo ""
          echo "Hook parity audit complete."
          echo "Initial scope: cycle-counter, path-log, session-end-check."
          echo "Remaining 18 hooks: follow-up issue #hook-parity-followup."
          echo "Remove '|| true' from parity steps when all fixture sets are present."
