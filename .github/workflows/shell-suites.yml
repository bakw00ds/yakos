# K-124: shell suites that guard the hooks, run under both shells that matter.
#
#   ubuntu-latest  bash 5
#   macos-latest   stock /bin/bash 3.2
#
# Why: a bash 3.2 crash in a hook exits 1, which Claude Code treats as
# non-blocking, so a crash is a fail-open. Reviewers had been running the hook
# hardening suite and the supervisor shell suites by hand because no workflow
# ran them (the Go twins ran via go test, the shell halves ran nowhere).
#
# hook-hardening   tests/run-hook-hardening-test.sh. The suite itself runs every
#                  case under `bash` first on PATH and again under /bin/bash, so
#                  on macOS it covers brew bash 5 and stock 3.2 in one run.
# supervisor       the supervisor shell suites, one matrix job each. Every
#                  suite starts hooks as `bash <hook>`, so on macOS stock 3.2 is
#                  put FIRST on PATH; otherwise the runner's brew bash 5 would
#                  quietly run the hooks and the 3.2 job would test nothing.
#
# agent-enums      tests/run-agent-enums-test.sh: the agent frontmatter enums, the
#                  agent files and project agent/skill directories the Go
#                  dispatcher skips, and a FIFO among the files, on both validators
#                  (bash and Go) with their findings compared byte for byte. It ran
#                  in no workflow before. The suite runs under `bash` on PATH and
#                  again under /bin/bash (3.2 on macOS), and needs bin/yakos, so
#                  it fails rather than checking only the bash half without it.
#
# The Go half of each supervisor suite needs bin/yakos, so each job builds it
# once. Existing coverage is untouched: hook-parity.yml already runs the budget
# and shadow suites (bash 5 on ubuntu, bash 3.2 on macOS), so shadow is not
# repeated here; ci.yml still runs the e2e suite on bash 5.
name: shell-suites

on:
  push:
    branches: [main]
    paths:
      - 'lib/hooks/**'
      - 'cli/lib/**'
      - 'cli-go/internal/hooks/**'
      - 'cli-go/internal/supervise/**'
      - 'cli-go/internal/decision/**'
      - 'cli-go/internal/budget/**'
      - 'cli-go/internal/validate/**'
      - 'cli-go/internal/agentscompose/**'
      - 'cli-go/cmd/yakos/cmd_hook*.go'
      - 'tests/**'
      - 'Makefile'
      - 'cli-go/go.mod'
      - 'cli-go/go.sum'
      - '.github/workflows/shell-suites.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/hooks/**'
      - 'cli/lib/**'
      - 'cli-go/internal/hooks/**'
      - 'cli-go/internal/supervise/**'
      - 'cli-go/internal/decision/**'
      - 'cli-go/internal/budget/**'
      - 'cli-go/internal/validate/**'
      - 'cli-go/internal/agentscompose/**'
      - 'cli-go/cmd/yakos/cmd_hook*.go'
      - 'tests/**'
      - 'Makefile'
      - 'cli-go/go.mod'
      - 'cli-go/go.sum'
      - '.github/workflows/shell-suites.yml'
  workflow_dispatch:
    inputs:
      lock_mutation:
        description: 'Also run the coalesce lock-removal mutation probe on macOS'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hook-hardening:
    name: hook hardening (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
            min: 837
          - os: macos-latest
            shell: /bin/bash
            min: 419
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Require bash 3.x at /bin/bash (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/bash --version | head -1
          [ "$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}"')" = 3 ] || { echo "ERROR: /bin/bash is not bash 3.x" >&2; exit 1; }
          echo "bash on PATH: $(command -v bash) $(bash -c 'echo $BASH_VERSION')"

      # coreutils provides gtimeout; without it the suite skips its hung-jq
      # cases ("no timeout/gtimeout on this machine"), which is fail-open
      # coverage we want to keep.
      - name: Install jq and coreutils (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: |
          command -v jq >/dev/null 2>&1 || brew install jq
          command -v gtimeout >/dev/null 2>&1 || brew install coreutils

      - name: Install jq and python3 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: if ! command -v jq >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y jq python3; fi

      # The suite skips its SIGHUP cases when SIGHUP is ignored (nohup, a
      # backgrounded parent). A skip there would hide a fail-open, so refuse to
      # start rather than pass with 16 cases silently not run.
      - name: Require SIGHUP to be deliverable
        shell: bash
        run: |
          out="$(bash -c 'kill -HUP $$; sleep 0.3; echo alive' 2>/dev/null || true)"
          if [ "$out" = alive ]; then
            echo "ERROR: SIGHUP is ignored in this job; the hardening suite would skip its SIGHUP cases" >&2
            exit 1
          fi

      - name: Hook hardening suite
        shell: bash
        timeout-minutes: 25
        env:
          MIN_PASSED: ${{ matrix.min }}
          SUITE_SHELL: ${{ matrix.shell }}
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/hardening.log"
          "$SUITE_SHELL" tests/run-hook-hardening-test.sh 2>&1 | tee "$log"
          rc=0
          if grep -E '^  SKIP .*SIGHUP' "$log"; then
            echo "::error::SIGHUP cases were skipped; they must run in CI"; rc=1
          fi
          if grep -E '^  SKIP ' "$log"; then
            echo "::error::hardening suite skipped cases; every case must run in CI"; rc=1
          fi
          line="$(grep -E '^hook-hardening: [0-9]+ passed, [0-9]+ failed' "$log" | tail -1)"
          passed="$(printf '%s' "$line" | sed -E 's/^hook-hardening: ([0-9]+) passed.*/\1/')"
          echo "hardening result: $line (floor $MIN_PASSED passed)"
          [ -n "$passed" ] && [ "$passed" -ge "$MIN_PASSED" ] || { echo "::error::expected at least $MIN_PASSED passed hardening cases, got '$passed'"; rc=1; }
          grep -qE '^hook-hardening: [0-9]+ passed, 0 failed' "$log" || { echo "::error::hardening suite reported failures"; rc=1; }
          if grep -E '^  FAIL|^  BAD' "$log"; then rc=1; fi
          # Both shells must really have run. On Linux that is bash on PATH plus
          # /bin/bash (equal counts). On macOS the runner's bash on PATH IS stock
          # /bin/bash 3.2, so the suite runs once, under 3.2.
          stock="$(grep -c '^  OK   bin-bash:' "$log" || true)"
          onpath="$(grep -c '^  OK   bash5:' "$log" || true)"
          echo "cases passed under /bin/bash: $stock; under bash on PATH ($(command -v bash)): $onpath"
          if [ "$(command -v bash)" = /bin/bash ]; then
            [ "$onpath" -gt 0 ] && [ "$stock" = 0 ] || { echo "::error::expected a single run under /bin/bash"; rc=1; }
          else
            [ "$stock" -gt 0 ] && [ "$stock" = "$onpath" ] || { echo "::error::/bin/bash and PATH bash case counts differ or are zero"; rc=1; }
          fi
          exit "$rc"

  supervisor:
    name: supervisor ${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        suite: [stream, coalesce, prefilter, ack-gate, e2e]
        exclude:
          # ci.yml's supervisor-e2e already runs this suite on ubuntu under bash 5.
          - os: ubuntu-latest
            suite: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Put stock bash 3.2 first on PATH (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          [ "$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}"')" = 3 ] || { echo "ERROR: /bin/bash is not bash 3.x" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Report the bash the suite will use
        shell: bash
        run: |
          echo "bash on PATH: $(command -v bash)  $(bash -c 'echo $BASH_VERSION')"
          if [ "$RUNNER_OS" = macOS ]; then
            [ "$(bash -c 'echo "${BASH_VERSINFO[0]}"')" = 3 ] || { echo "ERROR: bash on PATH is not 3.x" >&2; exit 1; }
          fi

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: command -v jq >/dev/null 2>&1 || brew install jq

      - name: Install jq and python3 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: if ! command -v jq >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y jq python3; fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: cli-go/go.sum

      - name: Build yakos
        shell: bash
        timeout-minutes: 10
        run: make build

      - name: Supervisor ${{ matrix.suite }} suite
        shell: bash
        timeout-minutes: 12
        env:
          SUITE: ${{ matrix.suite }}
          # The coalesce suite releases 10 hooks at once and each holds the launch
          # lock for the hold time, so the seam alone serialises 10 x the hold. The
          # hook waits at most 3 s for the lock; K-128 shrank a real hold to a few
          # builtins and one rename and made waiters back off, but 10 x 150 ms plus
          # a 3-core macOS runner's fork cost still leaves little margin (before
          # K-128 it was exhausted at 150 ms: coalesced counts 7-8 of 9), so macOS
          # keeps 50 ms. Treat the split plainly: ubuntu at 150 ms is the run that
          # proves the gate lock; macOS under bash 3.2 proves exact accounting and
          # that the hook does not crash. Whether 50 ms still catches a removed
          # lock is checked by the lock-mutation job below.
          YAKOS_COALESCE_HOLD_MS: ${{ runner.os == 'macOS' && '50' || '' }}
        run: |
          case "$SUITE" in
            e2e) script=tests/run-supervisor-e2e.sh ;;
            ack-gate) script=tests/run-supervisor-ack-gate-test.sh ;;
            *) script="tests/run-supervisor-$SUITE-test.sh" ;;
          esac
          [ -f "$script" ] || { echo "::error::missing $script"; exit 1; }
          # Run the harness itself under the stock shell on macOS.
          if [ "$RUNNER_OS" = macOS ]; then /bin/bash "$script"; else bash "$script"; fi

  # The agent frontmatter, agent file and project directory checks of `yakos
  # validate`, run on both implementations and compared. Both bash legs run on
  # both systems; on macOS /bin/bash is 3.2, which is where a bash-only crash or
  # a missing builtin would show. The suite makes its own FIFOs and symlinks and
  # runs validate under a time limit, so a pass that blocks fails the job and
  # does not hang it. Nothing may be skipped here: a skipped fixture is coverage
  # that quietly went away.
  agent-enums:
    name: agent enums (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Require bash 3.x at /bin/bash (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          /bin/bash --version | head -1
          [ "$(/bin/bash -c 'echo "${BASH_VERSINFO[0]}"')" = 3 ] || { echo "ERROR: /bin/bash is not bash 3.x" >&2; exit 1; }
          echo "bash on PATH: $(command -v bash) $(bash -c 'echo $BASH_VERSION')"

      - name: Install jq (macOS)
        if: runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        run: command -v jq >/dev/null 2>&1 || brew install jq

      - name: Install jq and python3 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        timeout-minutes: 5
        run: if ! command -v jq >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y jq python3; fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.25'
          cache-dependency-path: cli-go/go.sum

      - name: Build yakos
        shell: bash
        timeout-minutes: 10
        run: make build

      - name: Agent enums suite under bash on PATH and under /bin/bash
        shell: bash
        timeout-minutes: 12
        env:
          YAKOS_REQUIRE_GO_BINARY: '1'
          MIN_PASSED: '130'
        run: |
          rc=0
          for sh in bash /bin/bash; do
            log="$RUNNER_TEMP/agent-enums-$(basename "$sh").log"
            echo "=== tests/run-agent-enums-test.sh under $sh"
            "$sh" --version | head -1
            "$sh" tests/run-agent-enums-test.sh > "$log" 2>&1 || true
            cat "$log"
            line="$(grep -E '^agent-enums: [0-9]+ passed, [0-9]+ failed' "$log" | tail -1)"
            passed="$(printf '%s' "$line" | sed -E 's/^agent-enums: ([0-9]+) passed.*/\1/')"
            echo "$sh result: $line (floor $MIN_PASSED passed)"
            grep -qE '^agent-enums: [0-9]+ passed, 0 failed' "$log" || { echo "::error::$sh: the suite reported failures or did not finish"; rc=1; }
            if grep -E '^  SKIP ' "$log"; then echo "::error::$sh: the suite skipped fixtures; every one must run in CI"; rc=1; fi
            [ -n "$passed" ] && [ "$passed" -ge "$MIN_PASSED" ] || { echo "::error::$sh: expected at least $MIN_PASSED passed checks, got '$passed'"; rc=1; }
          done
          exit "$rc"

  # Probe: does the coalesce suite at the macOS hold time (50 ms) still go red
  # when the hook's gate lock is removed? Runs on a scratch copy with the lock
  # acquisition replaced by an unconditional success; the Go twin is skipped
  # (the suite only runs it when bin/yakos exists). All runs must go red, and
  # specifically in the concurrency (9) rounds. Evidence on PR #319 (50 ms hold,
  # macos-latest, bash 3.2): red in 5 of 5 runs. Dispatch with lock_mutation=true to rerun.
  coalesce-lock-mutation:
    name: coalesce lock mutation (macos-latest)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lock_mutation }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Install jq (macOS)
        shell: bash
        timeout-minutes: 5
        run: command -v jq >/dev/null 2>&1 || brew install jq

      - name: Mutate the gate lock in a scratch copy and run the suite 5 times
        shell: bash
        timeout-minutes: 15
        env:
          YAKOS_COALESCE_HOLD_MS: '50'
          RUNS: '5'
        run: |
          # shellcheck disable=SC2016
          scratch="$RUNNER_TEMP/mutant"
          mkdir -p "$scratch"
          cp -RL lib tests cli "$scratch"/   # -L: lib/hooks entries are symlinks, sed -i needs real files
          hook="$scratch/lib/hooks/supervisor-stream.sh"
          line='        if _ss_try_lock; then _ss_locked=1; return 0; fi'
          grep -qxF "$line" "$hook" || { echo "::error::lock line not found; update the mutation"; exit 1; }
          sed -i '' 's|^        if _ss_try_lock; then _ss_locked=1; return 0; fi$|        _ss_locked=1; return 0|' "$hook"
          grep -qxF "$line" "$hook" && { echo "::error::mutation did not apply"; exit 1; }
          echo "mutated: $(grep -n '^        _ss_locked=1; return 0$' "$hook")"
          ls "$scratch/bin/yakos" 2>/dev/null && { echo "::error::Go binary present; bash side only"; exit 1; }
          red=0
          for n in $(seq 1 "$RUNS"); do
            if /bin/bash "$scratch/tests/run-supervisor-coalesce-test.sh" > "$RUNNER_TEMP/mut-$n.log" 2>&1; then
              echo "run $n: GREEN (mutation NOT detected)"
            elif grep -q 'FAIL (9) bash round' "$RUNNER_TEMP/mut-$n.log"; then
              echo "run $n: red in the (9) concurrency rounds: $(grep -c 'FAIL (9) bash round' "$RUNNER_TEMP/mut-$n.log") failures"; red=$((red + 1))
            else
              echo "run $n: red, but not in (9) (unrelated):"; grep FAIL "$RUNNER_TEMP/mut-$n.log" | head -3
            fi
          done
          echo "mutation detected in (9) in $red of $RUNS runs"
          [ "$red" = "$RUNS" ]
