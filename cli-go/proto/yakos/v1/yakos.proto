// yakos.proto — gRPC service definitions for the yakOS daemon.
//
// Generated Go code lives in yakos.pb.go and yakos_grpc.pb.go.
// Regenerate with:
//   protoc --go_out=. --go_opt=paths=source_relative \
//          --go-grpc_out=. --go-grpc_opt=paths=source_relative \
//          proto/yakos/v1/yakos.proto
//
// Phase 2 operator directive: commit generated files; no CI codegen step.

syntax = "proto3";

package yakos.v1;

option go_package = "github.com/bakw00ds/yakos/proto/yakos/v1;yakosv1";

// ---- Dispatch ---------------------------------------------------------------

service Dispatch {
  // Run starts an agent dispatch and returns the result when complete.
  rpc Run(DispatchRunRequest) returns (DispatchRunResponse);

  // Stream starts an agent dispatch and streams token output as it arrives,
  // followed by a final summary message.
  rpc Stream(DispatchRunRequest) returns (stream DispatchStreamChunk);
}

message DispatchRunRequest {
  string agent      = 1;
  string task       = 2;
  string project    = 3;
  string runtime    = 4;
  string model      = 5;
  string yakos_root = 6;
  int32  timeout    = 7;
  // Phase 2 identity fields — additive; field numbers 8-10 are reserved.
  // Absent on legacy requests; receivers must tolerate their absence.
  // SELF-ASSERTED — attribution/labeling only. NEVER use for an authorization decision.
  string operator_id      = 8;
  string conversation_id  = 9;
  string session_id       = 10;
}

message DispatchRunResponse {
  int32  exit_code       = 1;
  double duration_s      = 2;
  int64  output_bytes    = 3;
  string model_resolved  = 4;
}

message DispatchStreamChunk {
  // type is "token" for incremental output or "summary" for the final record.
  string type            = 1;
  string text            = 2;   // present when type == "token"
  int32  exit_code       = 3;   // present when type == "summary"
  double duration_s      = 4;   // present when type == "summary"
  int64  output_bytes    = 5;   // present when type == "summary"
  string model_resolved  = 6;   // present when type == "summary"
}

// ---- Kanban -----------------------------------------------------------------

service Kanban {
  rpc List(KanbanListRequest)   returns (KanbanListResponse);
  rpc Add(KanbanAddRequest)     returns (KanbanAddResponse);
  rpc Move(KanbanMoveRequest)   returns (KanbanMoveResponse);
  rpc Done(KanbanDoneRequest)   returns (KanbanDoneResponse);
  // Watch streams kanban update events to the caller.
  rpc Watch(KanbanWatchRequest) returns (stream KanbanEvent);
}

message KanbanListRequest {
  string column = 1; // empty = all columns
  int32  limit  = 2; // 0 = no limit
}

message KanbanItem {
  string id     = 1;
  string title  = 2;
  string column = 3;
}

message KanbanListResponse {
  repeated KanbanItem items = 1;
}

message KanbanAddRequest {
  string title    = 1;
  string category = 2;
  string notes    = 3;
}

message KanbanAddResponse {
  string id = 1;
}

message KanbanMoveRequest {
  string id = 1;
  string to = 2;
}

message KanbanMoveResponse {
  bool ok = 1;
}

message KanbanDoneRequest {
  string id = 1;
}

message KanbanDoneResponse {
  bool ok = 1;
}

message KanbanWatchRequest {}

message KanbanEvent {
  string op   = 1; // "added" | "moved" | "done"
  string id   = 2;
  string from = 3;
  string to   = 4;
  string title = 5;
}

// ---- Cost -------------------------------------------------------------------

service Cost {
  rpc Aggregate(CostAggregateRequest) returns (CostAggregateResponse);
}

message CostAggregateRequest {
  string by    = 1; // "runtime" | "agent" | "day" | "project"
  string since = 2; // ISO-8601 lower bound; empty = all
  int32  limit = 3; // 0 = no limit
}

message CostRow {
  string key        = 1;
  int64  dispatches = 2;
  double total_s    = 3;
}

message CostAggregateResponse {
  string            by   = 1;
  repeated CostRow  rows = 2;
}

// ---- Status -----------------------------------------------------------------

service Status {
  rpc Read(StatusReadRequest) returns (StatusReadResponse);
}

message StatusReadRequest {
  string project = 1; // empty = infer from workspace
}

message StatusReadResponse {
  string project      = 1;
  string phase        = 2;
  string summary      = 3;
  int32  todo_count   = 4;
  int32  done_count   = 5;
}

// ---- Refresh ----------------------------------------------------------------

service Refresh {
  rpc Run(RefreshRunRequest) returns (RefreshRunResponse);
}

message RefreshRunRequest {
  // Field 1 (dry_run) is retired, not reused. It meant the opposite of
  // "apply" (proto3 zero value false == APPLY), so an old client compiled
  // against the retired field and a new server sharing field number 1
  // would silently invert: an explicit, safe `dry_run = true` would decode
  // as `apply = true` and write. Reserved so no future field can be
  // assigned number 1 or the name "dry_run" and repeat this (round-2
  // review N9, security-review-2026-09-14.md addendum).
  reserved 1;
  reserved "dry_run";

  // apply, when true, writes the detected repairs (hook scripts,
  // settings.json registrations, agent symlinks). The proto3 zero value
  // (false) — whether sent explicitly or simply omitted, which proto3
  // cannot distinguish for a scalar bool — means dry-run/read-only.
  //
  // SECURITY (round-2 review R5, M2 follow-up,
  // security-review-2026-09-14.md): this field replaces the retired
  // dry_run (field 1 above), whose proto3 zero value (false) meant
  // APPLY — so an omitted field already wrote hook scripts,
  // settings.json, and agent symlinks across every project under
  // $HOME/agent-control. A proto3 scalar bool cannot distinguish
  // "omitted" from "false" at all (there is no wire presence bit for a
  // plain bool field), so the only way to make the zero value safe is to
  // name the field for the SAFE state. Naming it "apply" (destructive =
  // true, explicit) closes that permanently; a future reader cannot
  // reintroduce the bug by "fixing" a default, because there is no
  // default state left that means write. Field number 3 (not 1) so an
  // old client's `dry_run = true` cannot decode as `apply = true` under a
  // real protobuf wire codec (round-2 review N9).
  bool apply = 3;
  // scope selects how many projects a write reaches. "" (default) or
  // "project" limits repair to the caller-configured WorkspaceRoot only;
  // "all" reaches every project under $HOME/agent-control
  // (refresh.CollectProjects) — a much larger blast radius that must be
  // requested explicitly (round-2 review R19).
  string scope = 2;
}

message RefreshRunResponse {
  string output = 1;
}

// ---- Version ------------------------------------------------------------

// CLI↔daemon build handshake — see internal/daemonclient and
// internal/buildinfo. Shares the exact field shape used by the JSON-RPC
// yakos.version method and the REST GET /v1/version endpoint.
service Version {
  rpc Get(VersionRequest) returns (VersionResponse);
}

message VersionRequest {}

message VersionResponse {
  // version is the legacy display string (internal/version.Read's output),
  // kept for parity with the other two transports. commit, lib_hash, and
  // build_id are the build-identity fields used for staleness comparison.
  string version  = 1;
  string commit   = 2;
  string lib_hash = 3;
  string build_id = 4;
}
