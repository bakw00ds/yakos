# yakOS project config — Rails profile overlay
# Generated by `yakos init --template rails`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: web-app
  standards:
    logging: false           # Standard 1 — structured service logs (e.g. lograge)
    changelog-ui: false      # Standard 2 — version + CHANGELOG visible in UI
    monitors: false          # Standard 3 — supervisor configs + /healthz
    feedback: false          # Standard 4 — user feedback widget
    architecture-viz: false  # Standard 5 — architecture page
    about-page: false        # Standard 6 — about page for new users

commands:
  test:  bundle exec rspec
  lint:  bundle exec rubocop
  build: bundle install

# ---- budget guardrails (v0.34+) --------------------------------------------
# budget:
#   enabled: true
#   max_tool_calls: 500
#   max_wall_seconds: 7200
#   max_repeat_same_tool: 8

# ---- Rails-specific notes --------------------------------------------------
# migration guard: never run db:migrate without human review.
# Controller changes must be covered by a request spec.
# Model changes must be covered by a model spec under spec/models/.
