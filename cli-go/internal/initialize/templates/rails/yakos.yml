# yakOS project config — Rails profile overlay
# Generated by `yakos init --template rails`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: web-app
  standards:
    logging: false
    changelog-ui: false
    monitors: false
    feedback: false
    architecture-viz: false
    about-page: false

# Rails-specific notes:
#   - default runtime: claude
#   - test command: bundle exec rspec
#   - migration guard: active (never run migrations without review)
