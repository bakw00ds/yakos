# Project-level yakOS configuration. Read at session start by the lead.
# Generated by `yakos init`. Schema documented in:
#   - lib/rules/profile-standards.md (active-standards behavior)
#   - cross-project-standards-plan.md §2 (per-standard wiring)

yakos: 0.9

profile:
  type: web-app
  standards:
    logging: false           # Standard 1 — structured service logs
    changelog-ui: false      # Standard 2 — version + CHANGELOG visible in UI
    monitors: false          # Standard 3 — supervisor configs + /healthz
    feedback: false          # Standard 4 — panda-os3.0-style feedback system
    architecture-viz: false  # Standard 5 — architecture page in UI
    about-page: false        # Standard 6 — about page for new users

# ---- budget guardrails (v0.34+) --------------------------------------------
# budget:
#   enabled: true
#   max_tool_calls: 500
#   max_wall_seconds: 7200
#   max_repeat_same_tool: 8

# ---- supervisor mode (v0.34+) -----------------------------------------------
# Enabled by default for new projects (surface-only mode). The supervisor
# scores recent dispatch activity every N tool calls and surfaces CRITICAL /
# escalation findings to the operator, but does NOT hard-block the lead.
#
# To block on CRITICAL: `yakos supervise set block_on_critical true`
#   (or set block_on_critical: true below).
# To turn off entirely: `yakos supervise disable`
#   (or set enabled: false below).
# Emergency session bypass (no config change): YAKOS_SUPERVISOR_DISABLE=1
supervisor:
  enabled: true
  runtime: claude
  agent: supervisor
  score_every_n_calls: 10
  block_on_critical: false   # surface-only by default; see note above
  model: haiku
