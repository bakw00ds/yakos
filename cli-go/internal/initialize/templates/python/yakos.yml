# yakOS project config — Python profile overlay
# Generated by `yakos init --template python`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: service
  standards:
    logging: false
    monitors: false
    architecture-viz: false

# Python-specific notes:
#   - default runtime: claude
#   - test command: pytest
#   - lint command: ruff check . && mypy .
#   - dependency file: pyproject.toml or requirements.txt
