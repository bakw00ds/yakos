# yakOS project config — Python profile overlay
# Generated by `yakos init --template python`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: service
  standards:
    logging: false           # Standard 1 — structured service logs (structlog/loguru)
    changelog-ui: false      # Standard 2 — version + CHANGELOG visible in UI
    monitors: false          # Standard 3 — supervisor configs + /healthz
    feedback: false          # Standard 4 — user feedback widget
    architecture-viz: false  # Standard 5 — architecture page
    about-page: false        # Standard 6 — about page for new users

commands:
  test:  pytest
  lint:  ruff check . && mypy .
  build: python -m build

# ---- budget guardrails (v0.34+) --------------------------------------------
# budget:
#   enabled: true
#   max_tool_calls: 500
#   max_wall_seconds: 7200
#   max_repeat_same_tool: 8

# ---- Python-specific notes -------------------------------------------------
# Always use parameterized queries; never interpolate SQL strings.
# Type-annotate all public functions; mypy must pass in strict mode.
# Dependencies declared in pyproject.toml, not requirements.txt.
