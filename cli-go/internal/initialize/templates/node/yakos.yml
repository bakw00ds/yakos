# yakOS project config — Node profile overlay
# Generated by `yakos init --template node`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: web-app
  standards:
    logging: false
    changelog-ui: false
    monitors: false
    feedback: false
    architecture-viz: false
    about-page: false

# Node-specific notes:
#   - default runtime: claude
#   - test command: npm test
#   - lint command: npm run lint
#   - build command: npm run build
