# yakOS project config — Node profile overlay
# Generated by `yakos init --template node`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: web-app
  standards:
    logging: false           # Standard 1 — structured service logs (pino/winston)
    changelog-ui: false      # Standard 2 — version + CHANGELOG visible in UI
    monitors: false          # Standard 3 — supervisor configs + /healthz
    feedback: false          # Standard 4 — user feedback widget
    architecture-viz: false  # Standard 5 — architecture page
    about-page: false        # Standard 6 — about page for new users

commands:
  test:  npm test
  lint:  npm run lint
  build: npm run build

# ---- budget guardrails (v0.34+) --------------------------------------------
# budget:
#   enabled: true
#   max_tool_calls: 500
#   max_wall_seconds: 7200
#   max_repeat_same_tool: 8

# ---- Node-specific notes ---------------------------------------------------
# Lock file (package-lock.json or yarn.lock) must be committed.
# No `npm install --save-dev` in CI; use `npm ci` for reproducible installs.
# Environment variables via .env files; never hardcode secrets.
