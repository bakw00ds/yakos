# yakOS project config — Go profile overlay
# Generated by `yakos init --template go`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: service
  standards:
    logging: false
    monitors: false
    architecture-viz: false

# Go-specific notes:
#   - default runtime: claude
#   - test command: go test ./...
#   - lint command: golangci-lint run
#   - build command: go build ./...
