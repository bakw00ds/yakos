# yakOS project config — Go profile overlay
# Generated by `yakos init --template go`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: service
  standards:
    logging: false           # Standard 1 — structured service logs (slog/zap)
    changelog-ui: false      # Standard 2 — version + CHANGELOG visible in UI
    monitors: false          # Standard 3 — supervisor configs + /healthz
    feedback: false          # Standard 4 — user feedback widget
    architecture-viz: false  # Standard 5 — architecture page
    about-page: false        # Standard 6 — about page for new users

commands:
  test:  go test ./...
  lint:  golangci-lint run ./...
  build: go build ./...

# ---- budget guardrails (v0.34+) --------------------------------------------
# budget:
#   enabled: true
#   max_tool_calls: 500
#   max_wall_seconds: 7200
#   max_repeat_same_tool: 8

# ---- Go-specific notes -----------------------------------------------------
# Parameterized SQL only — no fmt.Sprintf into queries.
# All exported functions must have godoc comments.
# Run go vet + go test ./... before every commit.
