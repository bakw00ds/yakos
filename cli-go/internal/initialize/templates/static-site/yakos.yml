# yakOS project config — Static-site profile overlay
# Generated by `yakos init --template static-site`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: web-app
  standards:
    logging: false
    changelog-ui: false
    about-page: false

# Static-site-specific notes:
#   - default runtime: claude
#   - build command: (project-defined; e.g. hugo, jekyll, eleventy)
#   - deploy: typically CI/CD via git push
