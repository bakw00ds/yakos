# yakOS project config — Rust profile overlay
# Generated by `yakos init --template rust`.
# Layered on top of the base template; project-specific values win.

yakos: 0.9

profile:
  type: cli-tool
  standards:
    logging: false           # Standard 1 — structured logs (tracing crate)
    changelog-ui: false      # Standard 2 — version + CHANGELOG visible in UI
    monitors: false          # Standard 3 — supervisor configs + /healthz
    feedback: false          # Standard 4 — user feedback widget
    architecture-viz: false  # Standard 5 — architecture page
    about-page: false        # Standard 6 — about page for new users

commands:
  test:  cargo test
  lint:  cargo clippy -- -D warnings
  build: cargo build --release

# ---- budget guardrails (v0.34+) --------------------------------------------
# budget:
#   enabled: true
#   max_tool_calls: 500
#   max_wall_seconds: 7200
#   max_repeat_same_tool: 8

# ---- Rust-specific notes ---------------------------------------------------
# cargo clippy -D warnings must pass before every commit.
# Cargo.lock committed for binaries; in .gitignore for libraries (see .gitignore).
# Use cargo fmt --check in CI; cargo fmt to auto-fix locally.
