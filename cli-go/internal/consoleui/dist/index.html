<!DOCTYPE html>
<!-- data-theme default: "og" (dark default). app.js overrides from localStorage
     before paint; this value prevents FOUC on first load. The server CSP forbids
     inline scripts so we cannot use a synchronous script tag here — instead we
     set a sensible default and accept a minimal one-frame flicker on theme change
     only when the stored preference differs from the default. See app.js §theme. -->
<html lang="en" data-theme="og">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- CSP is set via response header by the server so the ws:// origin
       matches --console-addr.  No inline CSP meta tag needed. -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <title>yakOS Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>
  <script src="/app.js"></script>
</body>
</html>
